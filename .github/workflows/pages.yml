name: Deploy Mana Geyser guide
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build findings-first guide and Research libraries
        run: |
          python scripts/build_v47.py
          node --check site/v44-data.js
          node --check site/v44-research.js
          node --check site/v54-sortable-tables.js
          node --check site/v60-front-guide.js
          node --check site/v62-guide-shell.js
          node --check site/v64-display-themes.js
          node --check site/v65-budget-theorycraft.js
          test -s site/assets/shaman-mana-geyser.webp
          test -s research/mana-flare-budget-thesis-2026-08-19.md
          grep -q 'Mana Geyser Shaman' site/index.html
          grep -q '<div class="heroArt"></div>' site/index.html
          grep -q 'NODE LIBRARY' site/index.html
          grep -q 'ITEM LIBRARY' site/index.html
          grep -q 'FLASK ENGINE' site/index.html
          grep -q 'REMNANT ENGINE' site/index.html
          grep -q 'v54-sortable-tables.js' site/index.html
          grep -q 'v60-front-guide.js' site/index.html
          grep -q 'v62-guide-shell.js' site/index.html
          grep -q 'v65-budget-theorycraft.js' site/index.html
          grep -q 'v64-display-themes.js' site/index.html
          grep -q 'CURRENT MINMAX THESIS' site/v65-budget-theorycraft.js
          grep -q 'DEFAULT FIRST · MANA' site/v65-budget-theorycraft.js
          grep -q '35% increased Mana regen' site/v65-budget-theorycraft.js
          grep -q 'BEST WEIRD NON-WAND' site/v65-budget-theorycraft.js
          grep -q 'Sacred Flow' site/v65-budget-theorycraft.js
          grep -q "Khatal's Rejuvenation" site/v65-budget-theorycraft.js
          grep -q 'Sacred Flame' site/v65-budget-theorycraft.js
          grep -q 'Arcane Surge' site/v65-budget-theorycraft.js
          grep -q 'Exceptional 2-socket rare Wand' site/v44-research.js
          grep -q 'Aspiring Genius' site/v44-research.js
          grep -q 'Perfect Inspiration Rune' site/v44-research.js
          grep -q 'does NOT grant flat Mana' site/v44-research.js
          grep -q 'Sacred Flame' site/v44-research.js
          grep -q 'Mana stacking vs generic Spell Damage' research/mana-flare-budget-thesis-2026-08-19.md
          grep -q 'Perfect Mind Rune' research/mana-flare-budget-thesis-2026-08-19.md
          grep -q 'It does not give flat Mana on a Wand' research/mana-flare-budget-thesis-2026-08-19.md
          grep -q 'Best weird non-Wand: Sacred Flame' research/mana-flare-budget-thesis-2026-08-19.md
          grep -q "Khatal's Rejuvenation" research/mana-flare-budget-thesis-2026-08-19.md
          grep -q 'Sacred Flow changes the budget' research/mana-flare-budget-thesis-2026-08-19.md
          grep -q '80–200%' site/v64-display-themes.js
          grep -q "const brightnesses={light:{label:'Light'},dark:{label:'Dark'}}" site/v64-display-themes.js
          grep -q "background-image:url('./assets/shaman-mana-geyser.webp')" site/v45.css
          if grep -q "label:'Lighter'\|label:'Darker'" site/v64-display-themes.js; then
            echo 'Removed brightness choices leaked back into display settings' >&2
            exit 1
          fi
          if grep -q 'v61-chase-defence-notes.js\|v65-thesis-refinement.js' site/index.html; then
            echo 'Superseded theorycraft/chase overlay leaked back into final guide' >&2
            exit 1
          fi
          if grep -q 'v63-display-settings.js' site/index.html; then
            echo 'Old display settings layer leaked back into final guide' >&2
            exit 1
          fi
          if grep -q 'v44-core.js\|v44-instils.js\|v45.js\|v46.js\|v46-benchmark.js\|v47.js\|v48-topology.js' site/index.html; then
            echo 'Removed optimizer/live-character runtime leaked back into final guide' >&2
            exit 1
          fi
          if grep -q 'poe.ninja\|calcRail\|poeNinjaSnapshot' site/index.html site/v44-data.js; then
            echo 'Removed poe.ninja/calculator data leaked back into final guide' >&2
            exit 1
          fi
          if grep -q 'compact calculator\|Overflow toggle\|Other Mana recovery / sec' site/index.html; then
            echo 'Stale calculator instructions leaked into static Research' >&2
            exit 1
          fi
          if grep -q 'v55-instills-lab.js\|v56-flex-instills-attributes.js\|v57-regalia-attr-note.js' site/v54-sortable-tables.js; then
            echo 'Optimizer loader leaked back into sortable table layer' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
