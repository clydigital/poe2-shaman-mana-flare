name: Sync PoE Ninja and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh poe.ninja snapshot
        run: python scripts/sync_poe.py
        continue-on-error: true
      - name: Build Mana Geyser front layer
        run: |
          base64 -d site/v36-mana-geyser.js.gz.b64 | gzip -d > site/v36-mana-geyser.js
          node --check site/v36-mana-geyser.js
      - name: Apply planner enhancement layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./v32-enhancements.js"></script>',
              '<script src="./v33-quest-rewards.js"></script>',
              '<script src="./v34-front.js"></script>',
              '<script src="./v35-progression-visuals.js"></script>',
              '<script src="./v36-mana-geyser.js"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
