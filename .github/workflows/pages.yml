name: Sync PoE Ninja and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh canonical poe.ninja snapshot
        run: python scripts/sync_poe.py
        continue-on-error: true
      - name: Build Guide + long Research page
        run: |
          python scripts/build_v44.py
          node --check site/v44-data.js
          node --check site/v44-core.js
          node --check site/v44-research.js
          node --check site/v44-instils.js
          grep -q 'Mana Geyser Shaman' site/index.html
          grep -q 'poe.ninja · DaSilkRoad-5508 / ToaBBMcy' site/index.html
          grep -q 'NODE LIBRARY' site/index.html
          grep -q 'ITEM LIBRARY' site/index.html
          grep -q 'FLASK ENGINE' site/index.html
          grep -q 'assets/druid-shaman.webp' site/v44.css
          if grep -q 'v32-enhancements.js\|v34-front.js\|v42-build.js\|v43.js' site/index.html; then
            echo 'Legacy UI layer leaked into v44 index' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
