name: Sync PoE Ninja and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh canonical poe.ninja snapshot
        run: python scripts/sync_poe.py
        continue-on-error: true
      - name: Preserve verified fields poe.ninja does not expose to plain fetches
        run: python scripts/normalize_snapshot.py
      - name: Rebuild exact current-tree topology from poe.ninja PoB
        run: python scripts/build_topology_v2.py
      - name: Build v47 player Guide + recovery/pathing Research
        run: |
          python scripts/build_v47.py
          node --check site/v44-data.js
          node --check site/v44-core.js
          node --check site/v44-research.js
          node --check site/v44-instils.js
          node --check site/v45.js
          node --check site/v46.js
          node --check site/v46-benchmark.js
          node --check site/v47.js
          node --check site/v48-topology.js
          node --check site/v49-body-lab.js
          node --check site/v50-visual-restoration.js
          node --check site/v51-strugglescream-package.js
          node --check site/v52-gain-as-extra-lab.js
          node --check site/v53-advanced-damage-nodes.js
          node --check site/v54-sortable-tables.js
          node --check site/v55-instills-lab.js
          node --check site/v56-flex-instills-attributes.js
          node --check site/v57-regalia-attr-note.js
          node --check site/v58-boots-lab.js
          python -m py_compile scripts/build_topology.py scripts/build_topology_v2.py
          test -s site/data/topology.json
          grep -q '"candidates"' site/data/topology.json
          grep -q '"routeSelectionVersion": 3' site/data/topology.json
          grep -q '"advancedDamageCandidates"' site/data/topology.json
          grep -q 'Mana Geyser Shaman' site/index.html
          grep -q 'poe.ninja · DaSilkRoad-5508 / ToaBBMcy' site/index.html
          grep -q 'NODE LIBRARY' site/index.html
          grep -q 'REMNANT ENGINE' site/index.html
          grep -q 'Arcane Remnants' site/index.html
          grep -q 'ITEM LIBRARY' site/index.html
          grep -q 'FLASK ENGINE' site/index.html
          grep -q 'STRUGGLESCREAM · 4 INSTILS' site/index.html
          grep -q 'Refresh with ChatGPT' site/index.html
          grep -q 'v46.js' site/index.html
          grep -q 'v46-benchmark.js' site/index.html
          grep -q 'v47.js' site/index.html
          grep -q 'v48-topology.js' site/index.html
          grep -q 'v54-sortable-tables.js' site/index.html
          grep -q 'v49-body-lab.js' site/v48-topology.js
          grep -q 'v50-visual-restoration.js' site/v48-topology.js
          grep -q 'v51-strugglescream-package.js' site/v48-topology.js
          grep -q 'v52-gain-as-extra-lab.js' site/v48-topology.js
          grep -q 'v53-advanced-damage-nodes.js' site/v48-topology.js
          grep -q 'v55-instills-lab.js' site/v54-sortable-tables.js
          grep -q 'v56-flex-instills-attributes.js' site/v54-sortable-tables.js
          grep -q 'v57-regalia-attr-note.js' site/v54-sortable-tables.js
          grep -q 'v58-boots-lab.js' site/v57-regalia-attr-note.js
          grep -q 'assets/shaman-mana-geyser.webp' site/v45.css
          if grep -q 'v32-enhancements.js\|v34-front.js\|v42-build.js\|v43.js' site/index.html; then
            echo 'Legacy UI layer leaked into v47 index' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
