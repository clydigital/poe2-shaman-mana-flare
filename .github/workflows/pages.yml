name: Sync PoE Ninja and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh poe.ninja snapshot
        run: python scripts/sync_poe.py
        continue-on-error: true
      - name: Build simplified Guide + Research site
        run: |
          cp site/v43-index.html site/index.html
          node --check site/v43.js
          grep -q 'Mana Geyser Shaman' site/index.html
          grep -q 'DPS + Mana Recovery' site/index.html
          grep -q 'MANA REGEN / RECOVERY' site/index.html
          if grep -q 'v32-enhancements.js\|v34-front.js\|v42-build.js' site/index.html; then
            echo 'Legacy UI layer leaked into v43 index' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
